<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - BrickBD</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo-section">
                <a href="../index.html">
                    <i class="fas fa-shopping-bag"></i>
                    <span>BrickBD</span>
                </a>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <h2>Login to Your Account</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" required placeholder="Enter your password">
                    </div>
                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>
                
                <div class="auth-divider">
                    <span>OR</span>
                </div>
                
                <div class="quick-login">
                    <p><strong>Quick Login Credentials:</strong></p>
                    <p>Admin: admin@brickbd.me / admin123</p>
                    <p>Customer: ashikur@example.com / user123</p>
                </div>
                
                <div class="auth-switch">
                    <p>Don't have an account? <a href="#" onclick="showRegisterForm(); return false;">Register Now</a></p>
                </div>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" class="auth-form" style="display: none;">
                <h2>Create New Account</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="registerName">Full Name</label>
                        <input type="text" id="registerName" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email Address</label>
                        <input type="email" id="registerEmail" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="registerPhone">Phone Number</label>
                        <input type="tel" id="registerPhone" required placeholder="+880 1XXX-XXXXXX">
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" required placeholder="Create a password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="registerConfirmPassword">Confirm Password</label>
                        <input type="password" id="registerConfirmPassword" required placeholder="Confirm your password">
                    </div>
                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" required> I agree to the Terms & Conditions
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Register</button>
                </form>
                
                <div class="auth-switch">
                    <p>Already have an account? <a href="#" onclick="showLoginForm(); return false;">Login Here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }

        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            // Check credentials
            const user = usersDB.find(u => u.email === email && u.password === password);
            
            if (user) {
                // Store user data (without password)
                const userData = {
                    id: user.id,
                    name: user.name,
                    email: user.email,
                    role: user.role,
                    phone: user.phone,
                    address: user.address
                };
                
                Storage.setCurrentUser(userData);
                showAlert('Login successful!', 'success');
                
                // Redirect based on role
                setTimeout(() => {
                    if (user.role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        window.location.href = '../index.html';
                    }
                }, 1000);
            } else {
                showAlert('Invalid email or password!', 'danger');
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const phone = document.getElementById('registerPhone').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            
            // Validate passwords match
            if (password !== confirmPassword) {
                showAlert('Passwords do not match!', 'danger');
                return;
            }
            
            // Check if user already exists
            const existingUser = usersDB.find(u => u.email === email);
            if (existingUser) {
                showAlert('Email already registered!', 'danger');
                return;
            }
            
            // Create new user
            const newUser = {
                id: usersDB.length + 1,
                name: name,
                email: email,
                password: password,
                role: 'customer',
                phone: phone,
                address: ''
            };
            
            // Add to database
            usersDB.push(newUser);
            
            // Auto login
            const userData = {
                id: newUser.id,
                name: newUser.name,
                email: newUser.email,
                role: newUser.role,
                phone: newUser.phone,
                address: newUser.address
            };
            
            Storage.setCurrentUser(userData);
            showAlert('Registration successful!', 'success');
            
            setTimeout(() => {
                window.location.href = '../index.html';
            }, 1000);
        }

        // Check if already logged in
        if (Storage.getCurrentUser()) {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
