<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Admin</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo"><i class="fas fa-shopping-bag"></i><span>BrickBD Admin</span></div>
            <nav class="admin-nav">
                <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html" class="active"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="users.html"><i class="fas fa-users"></i> Users</a>
                <a href="../../index.html"><i class="fas fa-globe"></i> View Site</a>
                <a href="#" onclick="logoutHandler(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>Order Management</h1>
            </header>

            <div class="admin-content">
                <div class="admin-card">
                    <div class="table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Date</th>
                                    <th>Items</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/data.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAdmin()) return;
            loadOrders();
        });

        function loadOrders() {
            const orders = Storage.getOrders();
            const tbody = document.getElementById('ordersTable');
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #999;">No orders yet</td></tr>';
                return;
            }

            tbody.innerHTML = orders.map(order => `
                <tr>
                    <td>${order.id}</td>
                    <td>${order.shippingInfo.fullName}</td>
                    <td>${formatDate(order.orderDate)}</td>
                    <td>${order.items.length} items</td>
                    <td>${formatPrice(order.total)}</td>
                    <td>
                        <select onchange="updateOrderStatus('${order.id}', this.value)" style="padding: 5px; border-radius: 5px; border: 2px solid var(--border-color);">
                            <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-icon" onclick="viewOrderDetails('${order.id}')" title="View Details"><i class="fas fa-eye"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function updateOrderStatus(orderId, newStatus) {
            const orders = Storage.getOrders();
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = newStatus;
                localStorage.setItem('orders', JSON.stringify(orders));
                showAlert('Order status updated!', 'success');
            }
        }

        function viewOrderDetails(orderId) {
            const orders = Storage.getOrders();
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            const items = order.items.map(item => `${item.name} x${item.quantity}`).join(', ');
            alert(`Order Details:\n\nOrder ID: ${order.id}\nCustomer: ${order.shippingInfo.fullName}\nPhone: ${order.shippingInfo.phone}\nEmail: ${order.shippingInfo.email}\nAddress: ${order.shippingInfo.address}, ${order.shippingInfo.city}\n\nItems: ${items}\n\nTotal: ${formatPrice(order.total)}\nPayment: ${order.paymentMethod}\nStatus: ${order.status}`);
        }
    </script>
</body>
</html>
