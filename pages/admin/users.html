<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo"><i class="fas fa-shopping-bag"></i><span>BrickBD Admin</span></div>
            <nav class="admin-nav">
                <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="users.html" class="active"><i class="fas fa-users"></i> Users</a>
                <a href="../../index.html"><i class="fas fa-globe"></i> View Site</a>
                <a href="#" onclick="logoutHandler(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>User Management</h1>
            </header>

            <div class="admin-content">
                <div class="admin-card">
                    <div class="table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Role</th>
                                    <th>Orders</th>
                                </tr>
                            </thead>
                            <tbody id="usersTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/data.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAdmin()) return;
            loadUsers();
        });

        function loadUsers() {
            const orders = Storage.getOrders();
            const tbody = document.getElementById('usersTable');
            
            tbody.innerHTML = usersDB.map(user => {
                const userOrders = orders.filter(o => o.userId === user.id).length;
                return `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.phone || 'N/A'}</td>
                        <td><span class="status-badge ${user.role === 'admin' ? 'status-pending' : 'status-delivered'}">${user.role.toUpperCase()}</span></td>
                        <td>${userOrders}</td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
