<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Admin</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo"><i class="fas fa-shopping-bag"></i><span>BrickBD Admin</span></div>
            <nav class="admin-nav">
                <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="products.html" class="active"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="users.html"><i class="fas fa-users"></i> Users</a>
                <a href="../../index.html"><i class="fas fa-globe"></i> View Site</a>
                <a href="#" onclick="logoutHandler(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>Product Management</h1>
                <button class="btn btn-primary" onclick="showAddProduct()"><i class="fas fa-plus"></i> Add Product</button>
            </header>

            <div class="admin-content">
                <div class="admin-card">
                    <div class="table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; padding: 20px; overflow-y: auto;">
        <div style="max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 10px;">
            <h2 id="modalTitle">Add New Product</h2>
            <form id="productForm" onsubmit="saveProduct(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="productCategory" required>
                            <option value="electronics">Electronics</option>
                            <option value="fashion">Fashion</option>
                            <option value="home">Home & Living</option>
                            <option value="books">Books</option>
                            <option value="sports">Sports</option>
                            <option value="toys">Toys</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Price (৳) *</label>
                        <input type="number" id="productPrice" required min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Stock Quantity *</label>
                        <input type="number" id="productStock" required min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="productDescription" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Vendor *</label>
                    <input type="text" id="productVendor" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Product</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/data.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        let editingProductId = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAdmin()) return;
            loadProducts();
        });

        function loadProducts() {
            const products = Storage.getProducts();
            const tbody = document.getElementById('productsTable');
            
            tbody.innerHTML = products.map(product => `
                <tr>
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${formatPrice(product.price)}</td>
                    <td>${product.stock}</td>
                    <td><span class="status-badge ${product.stock > 0 ? 'status-delivered' : 'status-pending'}">${product.stock > 0 ? 'In Stock' : 'Out of Stock'}</span></td>
                    <td>
                        <button class="btn-icon" onclick="editProduct(${product.id})" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="btn-icon danger" onclick="deleteProduct(${product.id})" title="Delete"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function showAddProduct() {
            editingProductId = null;
            document.getElementById('modalTitle').textContent = 'Add New Product';
            document.getElementById('productForm').reset();
            document.getElementById('productModal').style.display = 'block';
        }

        function editProduct(productId) {
            const products = Storage.getProducts();
            const product = products.find(p => p.id === productId);
            if (!product) return;

            editingProductId = productId;
            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('productName').value = product.name;
            document.getElementById('productCategory').value = product.category;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productStock').value = product.stock;
            document.getElementById('productDescription').value = product.description;
            document.getElementById('productVendor').value = product.vendor;
            document.getElementById('productModal').style.display = 'block';
        }

        function saveProduct(event) {
            event.preventDefault();
            
            const products = Storage.getProducts();
            const productData = {
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                price: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                description: document.getElementById('productDescription').value,
                vendor: document.getElementById('productVendor').value
            };

            if (editingProductId) {
                const index = products.findIndex(p => p.id === editingProductId);
                products[index] = { ...products[index], ...productData };
                showAlert('Product updated successfully!', 'success');
            } else {
                const newProduct = {
                    id: Math.max(...products.map(p => p.id)) + 1,
                    ...productData,
                    image: `https://via.placeholder.com/250x250/3498db/ffffff?text=${encodeURIComponent(productData.name.substring(0, 20))}`,
                    rating: 4.0,
                    reviews: 0,
                    featured: false,
                    hotDeal: false,
                    vendorType: 'local'
                };
                products.push(newProduct);
                showAlert('Product added successfully!', 'success');
            }

            Storage.setProducts(products);
            closeModal();
            loadProducts();
        }

        function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            let products = Storage.getProducts();
            products = products.filter(p => p.id !== productId);
            Storage.setProducts(products);
            showAlert('Product deleted successfully!', 'success');
            loadProducts();
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
            editingProductId = null;
        }
    </script>
</body>
</html>
