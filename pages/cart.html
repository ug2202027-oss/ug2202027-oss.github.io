<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - BrickBD</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header (simplified) -->
    <header class="header">
        <div class="top-bar">
            <div class="container">
                <div class="top-bar-content">
                    <div class="contact-info">
                        <span><i class="fas fa-phone"></i> +880 1234-567890</span>
                    </div>
                    <div class="user-actions">
                        <a href="login.html" id="authLink">Login / Register</a>
                        <span id="userGreeting" style="display: none;">Welcome, <span id="userName"></span> | <a href="#" id="logoutLink">Logout</a></span>
                    </div>
                </div>
            </div>
        </div>
        <nav class="navbar">
            <div class="container">
                <div class="nav-content">
                    <div class="logo">
                        <a href="../index.html">
                            <i class="fas fa-shopping-bag"></i>
                            <span>BrickBD</span>
                        </a>
                    </div>
                    <div class="nav-icons">
                        <a href="wishlist.html" class="nav-icon">
                            <i class="fas fa-heart"></i>
                            <span class="badge" id="wishlistCount">0</span>
                        </a>
                        <a href="cart.html" class="nav-icon active">
                            <i class="fas fa-shopping-cart"></i>
                            <span class="badge" id="cartCount">0</span>
                        </a>
                        <a href="profile.html" class="nav-icon">
                            <i class="fas fa-user"></i>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Cart Content -->
    <div class="container">
        <div class="breadcrumb">
            <a href="../index.html">Home</a>
            <i class="fas fa-chevron-right"></i>
            <span>Shopping Cart</span>
        </div>

        <h1 class="page-title">Shopping Cart</h1>

        <div class="cart-page">
            <!-- Cart Items -->
            <div class="cart-items-section">
                <div id="cartItems">
                    <!-- Cart items will be loaded here -->
                </div>
                
                <div id="emptyCart" style="display: none;">
                    <div class="empty-state">
                        <i class="fas fa-shopping-cart"></i>
                        <h2>Your cart is empty</h2>
                        <p>Add some products to get started!</p>
                        <a href="products.html" class="btn btn-primary">Continue Shopping</a>
                    </div>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary" id="cartSummary" style="display: none;">
                <h3>Order Summary</h3>
                
                <div class="summary-row">
                    <span>Subtotal (<span id="itemCount">0</span> items)</span>
                    <span id="subtotal">৳0</span>
                </div>
                
                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="shipping">৳0</span>
                </div>
                
                <div class="coupon-section">
                    <input type="text" id="couponInput" placeholder="Enter coupon code">
                    <button onclick="applyCouponCode()" class="btn btn-secondary">Apply</button>
                </div>
                
                <div class="summary-row discount" id="discountRow" style="display: none;">
                    <span>Discount</span>
                    <span id="discount">-৳0</span>
                </div>
                
                <div class="summary-divider"></div>
                
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">৳0</span>
                </div>
                
                <button onclick="proceedToCheckout()" class="btn btn-primary btn-block">
                    Proceed to Checkout <i class="fas fa-arrow-right"></i>
                </button>
                
                <a href="products.html" class="continue-shopping">
                    <i class="fas fa-arrow-left"></i> Continue Shopping
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 BrickBD. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let appliedCoupon = null;
        const SHIPPING_FEE = 60;
        const FREE_SHIPPING_THRESHOLD = 500;

        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });

        function loadCart() {
            const cart = Storage.getCart();
            const cartItemsContainer = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            const cartSummary = document.getElementById('cartSummary');

            if (cart.length === 0) {
                cartItemsContainer.style.display = 'none';
                emptyCart.style.display = 'block';
                cartSummary.style.display = 'none';
            } else {
                cartItemsContainer.style.display = 'block';
                emptyCart.style.display = 'none';
                cartSummary.style.display = 'block';
                
                cartItemsContainer.innerHTML = cart.map(item => createCartItem(item)).join('');
                updateSummary();
            }
        }

        function createCartItem(item) {
            return `
                <div class="cart-item">
                    <div class="item-image">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="item-details">
                        <h3>${item.name}</h3>
                        <p class="item-vendor"><i class="fas fa-store"></i> ${item.vendor}</p>
                        <p class="item-price">${formatPrice(item.price)}</p>
                    </div>
                    <div class="item-quantity">
                        <button onclick="updateQuantity(${item.id}, ${item.quantity - 1})" class="qty-btn">
                            <i class="fas fa-minus"></i>
                        </button>
                        <input type="number" value="${item.quantity}" min="1" max="99" 
                               onchange="updateQuantity(${item.id}, this.value)">
                        <button onclick="updateQuantity(${item.id}, ${item.quantity + 1})" class="qty-btn">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <div class="item-total">
                        <p class="total-price">${formatPrice(item.price * item.quantity)}</p>
                        <button onclick="removeItem(${item.id})" class="remove-btn">
                            <i class="fas fa-trash"></i> Remove
                        </button>
                    </div>
                </div>
            `;
        }

        function updateQuantity(productId, newQuantity) {
            newQuantity = parseInt(newQuantity);
            
            if (newQuantity < 1) {
                removeItem(productId);
                return;
            }
            
            if (newQuantity > 99) {
                showAlert('Maximum quantity is 99', 'info');
                return;
            }
            
            Storage.updateCartQuantity(productId, newQuantity);
            loadCart();
        }

        function removeItem(productId) {
            if (confirm('Remove this item from cart?')) {
                Storage.removeFromCart(productId);
                showAlert('Item removed from cart', 'info');
                loadCart();
            }
        }

        function updateSummary() {
            const cart = Storage.getCart();
            const subtotal = calculateCartTotal(cart);
            const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const shipping = subtotal >= FREE_SHIPPING_THRESHOLD ? 0 : SHIPPING_FEE;
            
            let discount = 0;
            if (appliedCoupon) {
                const result = applyCoupon(appliedCoupon.code, subtotal);
                if (result.success) {
                    discount = result.discount;
                }
            }
            
            const total = subtotal + shipping - discount;
            
            document.getElementById('itemCount').textContent = itemCount;
            document.getElementById('subtotal').textContent = formatPrice(subtotal);
            document.getElementById('shipping').textContent = shipping === 0 ? 'FREE' : formatPrice(shipping);
            document.getElementById('total').textContent = formatPrice(total);
            
            if (discount > 0) {
                document.getElementById('discountRow').style.display = 'flex';
                document.getElementById('discount').textContent = formatPrice(discount);
            } else {
                document.getElementById('discountRow').style.display = 'none';
            }
        }

        function applyCouponCode() {
            const couponInput = document.getElementById('couponInput');
            const code = couponInput.value.trim().toUpperCase();
            
            if (!code) {
                showAlert('Please enter a coupon code', 'info');
                return;
            }
            
            const cart = Storage.getCart();
            const subtotal = calculateCartTotal(cart);
            const result = applyCoupon(code, subtotal);
            
            if (result.success) {
                appliedCoupon = couponsDB.find(c => c.code === code);
                showAlert(result.message, 'success');
                updateSummary();
            } else {
                showAlert(result.message, 'danger');
                appliedCoupon = null;
            }
        }

        function proceedToCheckout() {
            const cart = Storage.getCart();
            if (cart.length === 0) {
                showAlert('Your cart is empty!', 'info');
                return;
            }
            
            // Save coupon if applied
            if (appliedCoupon) {
                localStorage.setItem('appliedCoupon', JSON.stringify(appliedCoupon));
            }
            
            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
