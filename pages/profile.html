<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - BrickBD</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-page { max-width: 1000px; margin: 40px auto; }
        .profile-content { display: grid; grid-template-columns: 250px 1fr; gap: 30px; }
        .profile-sidebar { background: white; padding: 25px; border-radius: 10px; box-shadow: var(--shadow); height: fit-content; }
        .profile-menu { list-style: none; }
        .profile-menu li { margin-bottom: 10px; }
        .profile-menu a { display: block; padding: 12px 15px; color: var(--dark-color); text-decoration: none; border-radius: 5px; transition: all 0.3s; }
        .profile-menu a:hover, .profile-menu a.active { background: var(--primary-color); color: white; }
        .profile-main { background: white; padding: 30px; border-radius: 10px; box-shadow: var(--shadow); }
        .profile-section { display: none; }
        .profile-section.active { display: block; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--light-color); }
        .profile-avatar { width: 80px; height: 80px; background: var(--primary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .order-item { padding: 20px; border: 2px solid var(--border-color); border-radius: 10px; margin-bottom: 20px; }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .order-status { padding: 5px 15px; border-radius: 5px; font-weight: bold; font-size: 0.9rem; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d1ecf1; color: #0c5460; }
        .status-shipped { background: #d4edda; color: #155724; }
        .status-delivered { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="nav-content">
                    <div class="logo"><a href="../index.html"><i class="fas fa-shopping-bag"></i><span>BrickBD</span></a></div>
                    <div class="nav-icons">
                        <a href="cart.html" class="nav-icon"><i class="fas fa-shopping-cart"></i><span class="badge" id="cartCount">0</span></a>
                        <a href="profile.html" class="nav-icon active"><i class="fas fa-user"></i></a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="profile-page">
            <div class="profile-content">
                <aside class="profile-sidebar">
                    <ul class="profile-menu">
                        <li><a href="#" class="active" onclick="showSection('overview'); return false;"><i class="fas fa-user"></i> Profile Overview</a></li>
                        <li><a href="#" onclick="showSection('orders'); return false;"><i class="fas fa-shopping-bag"></i> My Orders</a></li>
                        <li><a href="wishlist.html"><i class="fas fa-heart"></i> Wishlist</a></li>
                        <li><a href="#" onclick="logoutHandler(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                    </ul>
                </aside>

                <main class="profile-main">
                    <!-- Overview Section -->
                    <div id="overview" class="profile-section active">
                        <div class="profile-header">
                            <div class="profile-avatar" id="profileAvatar"></div>
                            <div>
                                <h2 id="profileName"></h2>
                                <p id="profileEmail" style="color: #666;"></p>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                            <div style="background: var(--light-color); padding: 20px; border-radius: 10px; text-align: center;">
                                <i class="fas fa-shopping-bag" style="font-size: 2rem; color: var(--primary-color); margin-bottom: 10px;"></i>
                                <h3 id="totalOrders">0</h3>
                                <p>Total Orders</p>
                            </div>
                            <div style="background: var(--light-color); padding: 20px; border-radius: 10px; text-align: center;">
                                <i class="fas fa-heart" style="font-size: 2rem; color: var(--danger-color); margin-bottom: 10px;"></i>
                                <h3 id="totalWishlist">0</h3>
                                <p>Wishlist Items</p>
                            </div>
                        </div>
                    </div>

                    <!-- Orders Section -->
                    <div id="orders" class="profile-section">
                        <h2 style="margin-bottom: 30px;">My Orders</h2>
                        <div id="ordersList"></div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = Storage.getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Load profile data
            document.getElementById('profileName').textContent = user.name;
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase();
            
            const orders = Storage.getOrders();
            const wishlist = Storage.getWishlist();
            
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('totalWishlist').textContent = wishlist.length;
            
            loadOrders();
        });

        function showSection(sectionId) {
            document.querySelectorAll('.profile-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.profile-menu a').forEach(a => a.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        function loadOrders() {
            const orders = Storage.getOrders();
            const container = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">No orders yet</p>';
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-item">
                    <div class="order-header">
                        <div>
                            <h3>Order #${order.id}</h3>
                            <p style="color: #666; margin-top: 5px;">${formatDate(order.orderDate)}</p>
                        </div>
                        <span class="order-status status-${order.status}">${order.status.toUpperCase()}</span>
                    </div>
                    <p><strong>Total:</strong> ${formatPrice(order.total)}</p>
                    <p><strong>Payment:</strong> ${order.paymentMethod.toUpperCase()}</p>
                    <p><strong>Items:</strong> ${order.items.length} product(s)</p>
                    <a href="track-order.html" class="btn btn-secondary" style="margin-top: 10px; display: inline-block;">Track Order</a>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
